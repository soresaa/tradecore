name: Build the TRADECORE Android app

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the app
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk TRADECORE.apk

      - name: Publish it (download link = releases/latest/download/TRADECORE.apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: TRADECORE app v1.${{ github.run_number }}
          body: Install TRADECORE.apk on your Android phone. Paper only - the app never places orders.
          files: TRADECORE.apk
          make_latest: true
